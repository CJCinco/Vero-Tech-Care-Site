<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Workshop Check-In Setup | Vero Tech Care</title>
  <meta name="theme-color" content="#111514" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="workshop-check-in.css?v=20260818-workshop-picker" />
  <script src="workshop-check-in-setup.js?v=20260818-workshop-picker" defer></script>
</head>
<body class="checkin-page setup-page">
  <main class="checkin-shell" aria-labelledby="page-title">
    <header class="checkin-header">
      <p class="checkin-brand">Vero Tech Care</p>
      <h1 id="page-title">Workshop Setup</h1>
      <p class="checkin-intro">CJ-only controls for preparing this iPad.</p>
    </header>

    <section class="checkin-card">
      <form id="setup-form" novalidate autocomplete="off" aria-busy="true">
        <div class="form-field">
          <label for="workshop-choice">Choose a workshop</label>
          <select
            id="workshop-choice"
            aria-describedby="workshop-help workshop-selection"
            required
            disabled
          >
            <option value="">Choose a workshop…</option>
          </select>
          <p id="workshop-help" class="field-help">
            Only workshops ready for secure sign-in and protected filing appear here.
          </p>
          <div id="workshop-selection" class="workshop-selection" aria-live="polite" hidden>
            <p class="workshop-selection-label">Selected workshop</p>
            <p id="workshop-selection-title" class="workshop-selection-title"></p>
            <p id="workshop-selection-details" class="workshop-selection-details"></p>
          </div>
        </div>

        <div class="form-field">
          <label for="setup-password">Setup password</label>
          <input
            id="setup-password"
            type="password"
            minlength="10"
            autocomplete="current-password"
            spellcheck="false"
            required
          />
        </div>

        <div class="setup-actions">
          <button id="open-button" class="checkin-primary-action" type="button" data-action="open" disabled>
            Open and activate this iPad
          </button>
          <button id="close-button" class="checkin-secondary-button" type="button" data-action="close" disabled>
            Close this workshop
          </button>
        </div>

        <p
          id="setup-status"
          class="submission-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          data-state="working"
          tabindex="-1"
        >Loading approved workshops…</p>
        <button id="catalog-retry" class="checkin-secondary-button catalog-retry" type="button" hidden>
          Try loading workshops again
        </button>
        <noscript>
          <p class="field-error">JavaScript must be enabled before this iPad can open workshop check-in.</p>
        </noscript>
      </form>
    </section>

    <section
      id="setup-success"
      class="checkin-card setup-success"
      tabindex="-1"
      aria-labelledby="setup-success-title"
      hidden
    >
      <p class="success-mark" aria-hidden="true">&#10003;</p>
      <h2 id="setup-success-title">Workshop open</h2>
      <p id="setup-success-copy">This iPad is ready for attendee check-in.</p>
      <a id="open-checkin-link" class="checkin-primary-action checkin-link-action" href="/workshop-check-in">
        Open check-in screen
      </a>
    </section>
  </main>
</body>
</html>
